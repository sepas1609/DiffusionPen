# DHSE Cloud Deployment Manifest (Chapter 20.3)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhse-license-server
  namespace: dhse-prod
  labels:
    app: dhse-license-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dhse-license-server
  template:
    metadata:
      labels:
        app: dhse-license-server
    spec:
      containers:
        - name: server
          image: registry.digitalocean.com/dhse/license-server:v2.0.1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dhse-db
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dhse-redis
                  key: url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dhse-jwt
                  key: secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dhse-license-service
  namespace: dhse-prod
spec:
  type: ClusterIP
  selector:
    app: dhse-license-server
  ports:
    - port: 80
      targetPort: 8080
